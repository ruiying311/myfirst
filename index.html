  q.o.forEach(opt=>{
    html += `
      <button onclick="pick('${opt.k}')" class="w-full text-left p-4 border border-slate-200 rounded-xl btn-hover hover:border-primary hover:bg-purple-50">
        ${opt.t}
      </button>
    `
  })
  document.getElementById('option-box').innerHTML = html
}

function pick(k){
  score[k]++
  current++
  if(current >= questions.length){
    showResult()
  }else{
    renderQ()
  }
}

function showResult(){
  document.getElementById('page-question').classList.add('hidden')
  document.getElementById('page-result').classList.remove('hidden')

  // 判定逻辑
  let type
  if(score.N >= score.S && score.I >= score.E && score.F>score.T) type = 'creator'
  else if(score.T>score.F && score.I>score.E && score.S >= score.P) type = 'tech'
  else if(score.E>score.I && score.T >= score.F) type = 'business'
  else if(score.J>score.P && score.S>score.N && score.T>=score.F) type = 'stable'
  else if(score.F>score.T) type = 'helper'
  else type = 'explorer'

  const r = resultMap[type]
  document.getElementById('res-icon').className = 'fa '+r.icon
  document.getElementById('res-name').innerText = r.name
  document.getElementById('res-desc').innerText = r.desc
  document.getElementById('res-good').innerText = r.good
  document.getElementById('res-bad').innerText = r.bad
  document.getElementById('res-job').innerText = r.job
  document.getElementById('res-notjob').innerText = r.notjob
  document.getElementById('res-city').innerText = r.city
  document.getElementById('res-suggest').innerText = r.suggest
}

function restart(){
  score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0,M:0,C:0,A:0,L:0}
  current = 0
  document.getElementById('page-result').classList.add('hidden')
  document.getElementById('page-start').classList.remove('hidden')
}
</script>
